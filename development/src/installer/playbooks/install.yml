# InstallONE FR-01: 설치 프로필 실행 플레이북
# 서버(src/installer/ansible_exec.py)가 ansible-runner로 실행합니다.
# 작업 이름의 머리말([연결]/[설치]/[검증])로 실패 단계를 구분하니 이름을 바꾸지 마세요.
- name: InstallONE 설치 프로필 실행
  hosts: seats
  gather_facts: false
  vars:
    workdir: 'C:\InstallONE'
    # 설치 직후 바뀐 PATH를 이 세션에 바로 반영 (WinRM 세션은 설치 전 PATH를 들고 있음)
    refresh_path: >-
      $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' +
      [Environment]::GetEnvironmentVariable('Path','User')
    # 아래 값은 서버가 extravars로 채웁니다
    choco_packages: []
    pip_packages: []
    checks: []
    examples: []
    imports: []
    run_seat_check: false
    seat_check_src: ""
  tasks:
    - name: "[연결] 좌석 접속 확인"
      ansible.windows.win_ping:

    # Chocolatey가 없으면 이 모듈이 먼저 설치하고, 이미 깔린 패키지는 건드리지 않습니다(changed=false).
    - name: "[설치] Chocolatey 패키지 설치"
      chocolatey.chocolatey.win_chocolatey:
        name: "{{ item.name }}"
        version: "{{ item.version if item.version else omit }}"
        state: present
      loop: "{{ choco_packages }}"
      loop_control:
        label: "{{ item.name }}"

    - name: "[설치] pip 패키지 설치"
      ansible.windows.win_shell: |
        {{ refresh_path }}
        $out = cmd /c "python -m pip install --disable-pip-version-check {{ pip_packages | join(' ') }} 2>&1"
        $code = $LASTEXITCODE
        $out
        exit $code
      register: pip_result
      changed_when: "'Successfully installed' in pip_result.stdout"
      when: pip_packages | length > 0

    - name: 검증 단계 불러오기
      ansible.builtin.import_tasks: ../../verification/tasks/verify.yml
