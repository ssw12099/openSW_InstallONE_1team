# 테스트 전용: 실제 플레이북(src/installer/playbooks/install.yml)과 같은 작업 이름·변수로
# 이 컴퓨터(로컬)에서 돌려 ansible-runner 이벤트 → 좌석 상태 분류를 실제로 확인합니다.
# Windows 모듈 대신 Linux 명령을 쓰고, 좌석별 결과는 호스트 변수(already, fail_install, fake_python)로 정합니다.
- name: InstallONE 로컬 이벤트 테스트
  hosts: seats
  gather_facts: false
  vars:
    choco_packages: []
    checks: []
    examples: []
    imports: []
    run_seat_check: false
    seat_check_src: ""
  tasks:
    - name: "[연결] 좌석 접속 확인"
      ansible.builtin.ping:

    - name: "[설치] Chocolatey 패키지 설치"
      ansible.builtin.command: "echo choco install {{ item.name }} {{ item.version if item.version else '' }}"
      loop: "{{ choco_packages }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: not (already | default(false))
      failed_when: fail_install | default(false)

    - name: "[검증] 점검 명령 실행"
      ansible.builtin.shell: "{{ item.command }}"
      environment:
        FAKE_PY: "{{ fake_python | default('3.12.10') }}"
      loop: "{{ checks }}"
      loop_control:
        label: "{{ item.label }}"
      register: check_result
      changed_when: false
      failed_when: >-
        check_result.rc != 0 or
        (item.expect | default('', true)) not in check_result.stdout

    - name: "[검증] 버전·예제 확인"
      ansible.builtin.command: >-
        {{ ansible_playbook_python }} {{ seat_check_src }}
        --examples={{ examples | join(',') }} --imports={{ imports | join(',') }}
      register: seat_check_result
      changed_when: false
      when: run_seat_check | bool
